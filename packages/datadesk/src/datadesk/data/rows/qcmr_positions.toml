# The rows of QCMR Table P-1, full-time positions by department, in FY2022 Q1 to FY2026 Q4.
# A row that names an entity carries no labels: the registry spells it (design section 7.2).
# A row that some editions do not print has periods for the editions that do. A period starts
# on the first day of the first quarter that prints the row, and ends open when FY2026 Q4,
# the newest edition, prints it. Fact and shape numbers are those of docs/plans/step-05.md.
table = "qcmr_positions"
root = "line=total_all_funds"
# The footnotes and the notice under the rows of the first grid page (shape 10).
drop = ['^\(\d+\)\s', '^NOTE:']

