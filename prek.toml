[[repos]]
repo = "local"
hooks = [
  {
    id = "ruff-check",
    name = "ruff check (lint + docstrings, autofix)",
    entry = "uv run ruff check --fix --force-exclude",
    language = "system",
    types = ["python"]
  },
  {
    id = "ruff-format",
    name = "ruff format",
    entry = "uv run ruff format --force-exclude",
    language = "system",
    types = ["python"]
  },
  {
    id = "ty",
    name = "ty check",
    entry = "uv run ty check",
    language = "system",
    types = ["python"],
    pass_filenames = false
  }
]
